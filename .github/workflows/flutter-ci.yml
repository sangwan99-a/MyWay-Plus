name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze, test and build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget and transit regression tests
        run: flutter test --reporter expanded

      - name: Build production web app
        run: flutter build web --release
